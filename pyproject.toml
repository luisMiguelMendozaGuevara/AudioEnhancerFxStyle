[project]
name = "audio-enhancer-fxstyle"
version = "1.8.0"
description = "Real-time system audio enhancer for Windows (WASAPI loopback DSP)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    # 6.11.x provoca crashes 0xC0000005 en Windows (bug de Qt); 6.8 es LTS.
    "PySide6>=6.8,<6.9",
    # pyaudiowpatch solo existe para Windows. El marcador permite resolver las
    # dependencias en Linux (job de tests del CI) sin romper la instalacion.
    'PyAudioWPatch>=0.2.12.8; sys_platform == "win32"',
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pyinstaller>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "audio_enhancer_venv",
    "actual",
    "artefactos_compilacion",
    "versiones_anteriores",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
# UP031 (%-formatting): los placeholders %s son parte del patrón de i18n
# (se traduce la plantilla y luego se aplica %), no convertir a f-strings.
ignore = ["UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "slow" marca lo que abre dispositivos de audio reales (PoC de captura por
# proceso): se puede excluir con -m "not slow" en máquinas sin sonido.
markers = ["slow: usa hardware de audio real (se salta si no hay dispositivo)"]

# Layout plano: sin esto, setuptools ve dos paquetes de nivel superior
# (assets/ y audio_enhancer/) y aborta con "Multiple top-level packages".
[tool.setuptools.packages.find]
include = ["audio_enhancer*"]

[tool.mypy]
python_version = "3.12"
# La UI depende de PySide6/pyaudiowpatch, sin stubs completos.
ignore_missing_imports = true
files = ["audio_enhancer"]
# Arranque estricto sobre lo ya limpio; se puede endurecer con el tiempo.
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["audio_enhancer"]
omit = ["audio_enhancer/ui/new/theme/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
