[project]
name = "audio-enhancer-fxstyle"
version = "1.0.0"
description = "Real-time system audio enhancer for Windows (WASAPI loopback DSP)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "PySide6>=6.7,<7",
    "PyAudioWPatch>=0.2.12.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyinstaller>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "audio_enhancer_venv",
    "actual",
    "artefactos_compilacion",
    "versiones_anteriores",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
# UP031 (%-formatting): los placeholders %s son parte del patrón de i18n
# (se traduce la plantilla y luego se aplica %), no convertir a f-strings.
ignore = ["UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
