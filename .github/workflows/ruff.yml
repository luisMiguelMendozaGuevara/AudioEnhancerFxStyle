name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    # Windows: mypy necesita winreg/ctypes.windll (codigo Windows-only);
    # en Ubuntu esos modulos no existen y el chequeo de tipos da falsos
    # positivos. Ruff en si es multiplataforma.
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install "ruff>=0.6" "mypy>=1.10"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy (tipos)
        run: python -m mypy
