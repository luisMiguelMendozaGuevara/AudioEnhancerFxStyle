name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # La app es WASAPI (Windows), pero la suite es multiplataforma: los
    # callbacks de PortAudio se fakean y Qt corre offscreen.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: System Qt libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        # Dependencias directas (pyproject): pyaudiowpatch es solo-Windows y
        # romperia el job en Ubuntu; los tests del motor lo fakean y no lo
        # necesitan. El paquete no se instala: conftest añade la raiz al path.
        # -c constraints.txt: el CI prueba EXACTAMENTE las versiones que se
        # empaquetan (antes instalaba rangos y podia testear otra combinacion).
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "scipy>=1.11" "PySide6>=6.8,<6.9" "pytest>=8.0" "pytest-cov>=5.0" -c constraints.txt

      - name: Compile Python source
        run: python -m compileall -q AudioEnhancer_FxStyle.py audio_enhancer tests

      - name: Run tests (con cobertura)
        # --cov-fail-under: red de regresiÃ³n (el suite cubre ~88%; el umbral
        # deja margen para no fallar por ruido de plataforma).
        run: python -m pytest tests/ -q --cov=audio_enhancer --cov-report=term-missing --cov-fail-under=85
