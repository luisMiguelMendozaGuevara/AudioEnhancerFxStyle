name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # La app es WASAPI (Windows), pero la suite es multiplataforma: los
    # callbacks de PortAudio se fakean y Qt corre offscreen.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12', '3.13']

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: System Qt libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        # UNA sola fuente de verdad: requirements-dev.txt (que arrastra
        # requirements.txt) + constraints.txt. Antes las especificaciones se
        # repetian aqui y el pin duplicado de PySide6 rompia la resolucion
        # cuando Dependabot subia versiones en los requirements.
        # pyaudiowpatch es solo-Windows y lleva marcador sys_platform: en
        # Ubuntu se omite solo. No se instala el paquete: conftest anade la
        # raiz al path.
        # -c constraints.txt: el CI prueba EXACTAMENTE las versiones que se
        # empaquetan (antes instalaba rangos y podia testear otra combinacion).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Compile Python source
        run: python -m compileall -q AudioEnhancer_FxStyle.py audio_enhancer tests

      - name: Run tests (con cobertura)
        # --cov-fail-under: red de regresiÃ³n (el suite cubre ~88%; el umbral
        # deja margen para no fallar por ruido de plataforma).
        run: python -m pytest tests/ -q --cov=audio_enhancer --cov-report=term-missing --cov-fail-under=85
