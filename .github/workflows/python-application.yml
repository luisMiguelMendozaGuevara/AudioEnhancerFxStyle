name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # La app es WASAPI (Windows), pero la suite es multiplataforma: los
    # callbacks de PortAudio se fakean y Qt corre offscreen.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # Dependencias directas (pyproject): pyaudiowpatch es solo-Windows y
        # romperia el job en Ubuntu; los tests del motor lo fakean y no lo
        # necesitan. El paquete no se instala: conftest añade la raiz al path.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy "PySide6>=6.7,<7" "pytest>=8.0"

      - name: Compile Python source
        run: python -m compileall -q AudioEnhancer_FxStyle.py audio_enhancer tests

      - name: Run tests
        run: python -m pytest tests/ -q
