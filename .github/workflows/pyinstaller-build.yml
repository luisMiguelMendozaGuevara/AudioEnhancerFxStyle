name: PyInstaller Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # -c constraints.txt: versiones EXACTAS probadas -> build reproducible.
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]" -c constraints.txt

      # Dos artefactos:
      #  1) ONEDIR + Inno Setup -> instalador (autoria de accesos directos, desinstalador)
      #  2) ONEFILE -> un .exe unico para quien no quiera instalar
      # Ambos comparten las mismas versiones (constraints.txt).

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build executable (onedir, via spec)
        run: python -m PyInstaller --clean --noconfirm AudioEnhancerFxStyle.spec

      - name: Build installer (Inno Setup)
        shell: pwsh
        # La versión sale de constants.py (fuente única): el instalador queda
        # nombrado Setup-<APP_VERSION>.exe, sin depender de un default manual.
        run: |
          $version = (Select-String -Path audio_enhancer/constants.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Installer version: $version"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\AudioEnhancerFxStyle.iss

      - name: Build portable executable (onefile, via spec)
        run: python -m PyInstaller --clean --noconfirm AudioEnhancerFxStyle-onefile.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioEnhancerFxStyle-windows
          path: |
            dist/AudioEnhancerFxStyle.exe
            dist/installer/AudioEnhancerFxStyle-Setup-*.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/AudioEnhancerFxStyle-Setup-*.exe
            dist/AudioEnhancerFxStyle.exe
          generate_release_notes: true
