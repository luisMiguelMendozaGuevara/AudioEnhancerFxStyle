name: PyInstaller Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # -c constraints.txt: versiones EXACTAS probadas -> build reproducible.
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]" -c constraints.txt

      - name: Build executable
        shell: cmd
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name AudioEnhancerFxStyle
          --icon assets\app.ico
          --add-data "assets;assets"
          --hidden-import pyaudiowpatch
          AudioEnhancer_FxStyle.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioEnhancerFxStyle-windows
          path: dist/AudioEnhancerFxStyle.exe
          if-no-files-found: error

      - name: Publish executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AudioEnhancerFxStyle.exe
          generate_release_notes: true
